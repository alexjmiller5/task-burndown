<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="dashboard-shell" content="1" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- use-credentials: manifest fetches are credentialless by default and
         CF Access would bounce them to the login page -->
		<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<meta name="theme-color" content="#030304" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div
			id="dashboard-loading"
			role="status"
			style="padding: 3rem 1rem; text-align: center; font: 14px system-ui"
		>
			Loading Task Burndown...<br />If this takes a moment, check your connection.
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
